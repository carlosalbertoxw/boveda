[versions]
# La misma version de Kotlin que boveda-android y boveda-nucleo: el nucleo se
# compila dentro de esta build y conviene que todo salga del mismo compilador.
kotlin = "2.4.21"
compose = "1.12.2"
coroutines = "1.11.0"
# org.json es la misma API que Android trae de fabrica. Usarla aqui mantiene el
# formato del respaldo identico byte a byte, incluidos los espacios de toString(2).
json = "20260814"
# Solo para pedirle a Windows que excluya la ventana de capturas de pantalla.
jna = "5.19.1"
junit = "4.13.2"

[libraries]
# El codigo compartido con Android: cripto, formato del respaldo, fusion y
# papelera. Sin version porque no se descarga: settings.gradle.kts lo incluye
# desde ../boveda-nucleo con includeBuild.
boveda-nucleo = { module = "com.carlosalbertoxw.boveda:boveda-nucleo" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
json = { group = "org.json", name = "json", version.ref = "json" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
