# La JVM con la que corre Gradle (no la de la app, que compila a Java 17).
# detekt 1.23 no arranca sobre los JDK mas nuevos (falla con el 26), asi que Gradle se queda en
# un JDK 21 instalado en el equipo: lo busca solo, incluido el JBR que trae
# Android Studio en ~/.jdks, sin tocar JAVA_HOME.
toolchainVersion=21
