[versions]
agp = "9.5.1"
# La misma version de Kotlin que boveda-desktop y boveda-nucleo: el nucleo se
# compila dentro de esta build y conviene que todo salga del mismo compilador.
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
navigationCompose = "2.10.2"
room = "2.8.5"
biometric = "1.1.0"
# biometric 1.1.0 arrastra fragment 1.2.5, anterior a la API de ActivityResult:
# su FragmentActivity rechaza los request codes de mas de 16 bits que genera
# activity-compose, y cualquier launcher revienta al abrirse. Se fija a mano
# mientras no haya un biometric estable mas nuevo (1.4.0 sigue en beta).
fragment = "1.9.1"
# biometric arrastra appcompat 1.2.0 para su dialogo de huella en API 26-27.
# Se fija a mano para no quedarse con una version de 2020.
appcompat = "1.8.0"
sqlcipher = "4.20.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxTestCore = "1.7.0"
robolectric = "4.17"
detekt = "1.23.8"

[libraries]
# El codigo compartido con escritorio: cripto, formato del respaldo, fusion y
# papelera. Sin version porque no se descarga: settings.gradle.kts lo incluye
# desde ../boveda-nucleo con includeBuild.
boveda-nucleo = { module = "com.carlosalbertoxw.boveda:boveda-nucleo" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compila Kotlin por su cuenta y ya no se aplica este plugin. Se declara
# solo en el build.gradle.kts raiz, sin aplicarlo, para fijar que version del
# compilador usa AGP: si no, usaria la que trae de serie.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
